version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # vite, vitest, @vitejs/plugin-react and esbuild are dev-only build/test
    # tools. Their major upgrades cascade into a peer-dependency conflict with
    # the pinned @types/node (e.g. vitest 5 wants @types/node >=22) and break
    # `npm install` on Vercel. Stay on the current majors; still take the
    # minor and patch fixes, including security patches.
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/mocker"
        update-types: ["version-update:semver-major"]
